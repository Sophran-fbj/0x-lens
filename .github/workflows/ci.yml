name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Compile, build, and offline E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Type-check
        run: npm run compile

      - name: Build extension
        run: npm run build

      - name: Run offline browser tests
        env:
          OXL_E2E_BROWSER: chromium
        run: |
          npm run fixture -- --host 127.0.0.1 > /tmp/0x-lens-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          xvfb-run -a node e2e/verify.mjs

      - name: Run audit suites (public build, then mock-RPC build)
        env:
          OXL_E2E_BROWSER: chromium
        run: |
          npm run fixture -- --host 127.0.0.1 > /tmp/0x-lens-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:5173/ > /dev/null

          # Offline audit suites against the public build produced above
          # (perf is excluded on purpose: wall-clock sensitive, and it
          # rewrites docs/nightly-audit/perf-runs.json).
          for suite in detect lifecycle geometry compat; do
            echo "::group::audit/${suite}"
            xvfb-run -a node "e2e/audit/${suite}.mjs"
            echo "::endgroup::"
          done

          # Mock-RPC variant: rebuild against the local mock, guard against
          # an impostor on 5178, then the two suites. Sequential by nature:
          # each suite spawns its own server on 127.0.0.1:5178 and wipes its
          # isolated profile on startup.
          VITE_RPC_URL=http://127.0.0.1:5178/rpc npm run build
          node e2e/audit/verify-zombie-guard.mjs
          OXL_E2E_PROFILE=.playwright-profile-mock xvfb-run -a node e2e/audit/rpc-privacy.mjs
          OXL_E2E_PROFILE=.playwright-profile-mock xvfb-run -a node e2e/audit/mv3.mjs

  release:
    name: Publish Chrome ZIP
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          version=$(node -e "const fs=require('fs'); const text=fs.readFileSync('wxt.config.ts','utf8'); const match=text.match(/version:\\s*'([^']+)'/); if(!match) process.exit(1); process.stdout.write(match[1]);")
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Package extension
        run: npm run zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/0x-lens-*-chrome.zip --generate-notes --title "$GITHUB_REF_NAME"
